<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Bravogroup Monday Linker</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; background: #fafafa; display: flex; flex-direction: column; min-height: 90vh; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-grow: 1; }
        .logo-container { text-align: center; margin-bottom: 15px; }
        #logo { max-width: 140px; height: auto; }
        h2 { font-size: 18px; color: #333; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        label { display: block; margin: 10px 0 5px; font-size: 11px; color: #666; font-weight: bold; }
        select, button { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #c8d0d8; font-size: 14px; margin-bottom: 10px; }
        button { background: #0073ea; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #ccc; }
        #status { margin-top: 15px; font-size: 12px; text-align: center; white-space: pre-wrap; }
        .err-msg { color: red; font-weight: bold; }
        
        /* Új stílus az aláíráshoz */
        .footer-signature { 
            font-size: 10px; 
            color: #aaa; 
            text-align: center; 
            margin-top: 20px; 
            font-weight: normal;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="Bravogroup.png" alt="Bravogroup" id="logo">
        </div>
        <h2>Küldés a monday-re</h2>
        
        <label>PROJEKT (BOARD)</label>
        <select id="boardSelect" onchange="loadGroups()"><option>Betöltés...</option></select>

        <label>CSOPORT (GROUP)</label>
        <select id="groupSelect" onchange="loadItems()"><option>Válassz táblát...</option></select>

        <label>SZÜLŐ FELADAT (SUBITEMHEZ - OPCIONÁLIS)</label>
        <select id="itemSelect">
            <option value="">-- Maradjon fő feladat --</option>
        </select>

        <button id="mainBtn" onclick="sendToMonday()">Létrehozás és Linkelés</button>
        <div id="status"></div>
    </div>

    <!-- Az aláírásod -->
    <div class="footer-signature">
        Flow & Code by Kisari
    </div>

    <script>
        // Az API kulcsot a kérésednek megfelelően benne hagytam
        const API_KEY = "eyJhbGciOiJIUzI1NiJ9.eyJ0aWQiOjY1NjYwNTU2NCwiYWFpIjoxMSwidWlkIjoxMDI2Mzg3NjQsImlhZCI6IjIwMjYtMDUtMTFUMDk6Mzk6MzMuMDAwWiIsInBlciI6Im1lOndyaXRlIiwiYWN0aWQiOjM0ODA2ODMyLCJyZ24iOiJldWMxIn0.RyxQWrt6L4ZYwLfzRV_RTl-k46oUDHJhTnxD7b45W4o";
        let emailInfo = {};

        Office.onReady((info) => {
            if (info.host === Office.HostType.Outlook) {
                fetchBoards();
                prepareEmailData();
            }
        });

        function prepareEmailData() {
            const item = Office.context.mailbox.item;
            const encodedId = encodeURIComponent(item.itemId);
            emailInfo = {
                subject: item.subject,
                link: `https://outlook.office.com/mail/deeplink?ItemID=${encodedId}`,
                body: ""
            };
            item.body.getAsync(Office.CoercionType.Text, (result) => {
                if (result.status === Office.AsyncResultStatus.Succeeded) {
                    emailInfo.body = result.value;
                }
            });
        }

        async function fetchBoards() {
            const status = document.getElementById('status');
            try {
                const query = '{ boards (limit: 50) { id name } }';
                const res = await callMonday(query);
                if (res.errors) {
                    status.innerHTML = `<span class="err-msg">API Hiba: ${res.errors[0].message}</span>`;
                    return;
                }
                const select = document.getElementById('boardSelect');
                select.innerHTML = '<option value="">-- Válassz --</option>';
                res.data.boards.forEach(b => select.innerHTML += `<option value="${b.id}">${b.name}</option>`);
                status.innerHTML = "✅ Táblák betöltve.";
            } catch (e) {
                status.innerHTML = `<span class="err-msg">Hiba: ${e.message}</span>`;
            }
        }

        async function loadGroups() {
            const boardId = document.getElementById('boardSelect').value;
            if (!boardId) return;
            const select = document.getElementById('groupSelect');
            const itemSelect = document.getElementById('itemSelect');
            select.innerHTML = '<option>Betöltés...</option>';
            itemSelect.innerHTML = '<option value="">-- Maradjon fő feladat --</option>';
            
            const query = `{ boards (ids: ${boardId}) { groups { id title } } }`;
            const res = await callMonday(query);
            select.innerHTML = '<option value="">-- Válassz csoportot --</option>';
            res.data.boards[0].groups.forEach(g => select.innerHTML += `<option value="${g.id}">${g.title}</option>`);
        }

        async function loadItems() {
            const boardId = document.getElementById('boardSelect').value;
            const groupId = document.getElementById('groupSelect').value;
            if (!boardId || !groupId) return;

            const select = document.getElementById('itemSelect');
            select.innerHTML = '<option value="">Elemek betöltése...</option>';

            const query = `{ boards (ids: ${boardId}) { groups (ids: "${groupId}") { items_page { items { id name } } } } }`;
            const res = await callMonday(query);
            
            select.innerHTML = '<option value="">-- Maradjon fő feladat --</option>';
            const items = res.data.boards[0].groups[0].items_page.items;
            items.forEach(item => {
                select.innerHTML += `<option value="${item.id}">${item.name}</option>`;
            });
        }

        async function sendToMonday() {
            const btn = document.getElementById('mainBtn');
            const status = document.getElementById('status');
            const boardId = document.getElementById('boardSelect').value;
            const groupId = document.getElementById('groupSelect').value;
            const parentItemId = document.getElementById('itemSelect').value;

            if(!boardId || !groupId) return alert("Válassz ki legalább egy projektet és egy csoportot!");

            btn.disabled = true;
            status.innerHTML = "⏳ Küldés folyamatban...";

            try {
                let createQuery;
                if (parentItemId) {
                    createQuery = `mutation { create_subitem (parent_item_id: ${parentItemId}, item_name: "${emailInfo.subject}") { id } }`;
                } else {
                    createQuery = `mutation { create_item (board_id: ${boardId}, group_id: "${groupId}", item_name: "${emailInfo.subject}") { id } }`;
                }

                const itemRes = await callMonday(createQuery);
                const newItem = parentItemId ? itemRes.data.create_subitem : itemRes.data.create_item;
                const itemId = newItem.id;

                const shortBody = emailInfo.body.substring(0, 2500);
                const fullUpdateText = `🔗 Email link: ${emailInfo.link}\n\n--- TARTALOM ---\n${shortBody}`;
                
                const updateQuery = `mutation { create_update (item_id: ${itemId}, body: ${JSON.stringify(fullUpdateText)}) { id } }`;
                await callMonday(updateQuery);

                status.innerHTML = "✅ Sikeresen átküldve!";
            } catch (e) {
                status.innerHTML = "❌ Hiba a küldéskor. (Lehet, hogy a csoport üres?)";
                console.error(e);
            }
            btn.disabled = false;
        }

        async function callMonday(query) {
            const r = await fetch("https://api.monday.com/v2", {
                method: 'post',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': API_KEY 
                },
                body: JSON.stringify({ query })
            });
            if (!r.ok) throw new Error(`Szerver hiba: ${r.status}`);
            return r.json();
        }
    </script>
</body>
</html>
