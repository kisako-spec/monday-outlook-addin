<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Bravogroup Monday Linker</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            padding: 15px; 
            background-color: #fafafa; 
            color: #333;
        }
        .card { 
            background: white; 
            border-radius: 8px; 
            padding: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            max-width: 350px;
            margin: 0 auto;
        }
        .logo-container { 
            text-align: center; 
            margin-bottom: 15px; 
        }
        #logo { 
            max-width: 150px; 
            height: auto; 
            display: inline-block;
        }
        h2 { 
            font-size: 18px; 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 20px;
            color: #0073ea;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        label { 
            display: block; 
            margin: 15px 0 5px; 
            font-size: 12px; 
            color: #666; 
            font-weight: bold; 
            text-transform: uppercase;
        }
        select, button { 
            width: 100%; 
            padding: 12px; 
            border-radius: 4px; 
            border: 1px solid #c8d0d8; 
            font-size: 14px; 
            box-sizing: border-box;
        }
        select:focus {
            border-color: #0073ea;
            outline: none;
        }
        button { 
            background: #0073ea; 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 25px; 
            transition: background 0.2s;
        }
        button:hover { 
            background: #005bb5; 
        }
        button:disabled {
            background: #cbd4e1;
            cursor: not-allowed;
        }
        #status { 
            margin-top: 20px; 
            font-size: 13px; 
            text-align: center; 
            min-height: 20px;
        }
        .success { color: #00a01c; font-weight: bold; }
        .error { color: #df2f2f; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-container">
            <img src="Bravogroup.png" alt="Bravogroup" id="logo">
        </div>
        
        <h2>Küldés a monday-re</h2>
        
        <label for="boardSelect">Projekt (Board)</label>
        <select id="boardSelect" onchange="loadGroups()">
            <option>Betöltés...</option>
        </select>

        <label for="groupSelect">Csoport (Group)</label>
        <select id="groupSelect">
            <option>Válassz táblát...</option>
        </select>

        <button id="mainBtn" onclick="sendToMonday()">Létrehozás és Linkelés</button>
        
        <div id="status"></div>
    </div>

    <script>
        const API_KEY = "eyJhbGciOiJIUzI1NiJ9.eyJ0aWQiOjY1NjYwNTU2NCwiYWFpIjoxMSwidWlkIjoxMDI2Mzg3NjQsImlhZCI6IjIwMjYtMDUtMTFUMDk6Mzk6MzMuODgzWiIsInBlciI6Im1lOndyaXRlIiwiYWN0aWQiOjM0ODA2ODMyLCJyZ24iOiJldWMxIn0.WA-r26Y342FgpVr6JX_8lwo6-waI9q-z-V2YBdSm5R4";
        let emailInfo = {};

        // Inicializálás az Outlookban
        Office.onReady((info) => {
            if (info.host === Office.HostType.Outlook) {
                fetchBoards();
                prepareEmailData();
            }
        });

        // Email adatok előkészítése (Link + Szöveg)
        function prepareEmailData() {
            const item = Office.context.mailbox.item;
            const encodedId = encodeURIComponent(item.itemId);
            
            emailInfo = {
                subject: item.subject,
                link: `https://outlook.office.com/mail/deeplink?ItemID=${encodedId}`,
                body: "" 
            };

            // Email törzsének kérése (sima szövegként)
            item.body.getAsync(Office.CoercionType.Text, (result) => {
                if (result.status === Office.AsyncResultStatus.Succeeded) {
                    emailInfo.body = result.value;
                }
            });
        }

        // Táblák betöltése a monday-ről
        async function fetchBoards() {
            try {
                const query = '{ boards (limit: 50) { id name } }';
                const res = await callMonday(query);
                const select = document.getElementById('boardSelect');
                select.innerHTML = '<option value="">-- Válassz --</option>';
                if (res.data && res.data.boards) {
                    res.data.boards.forEach(b => {
                        select.innerHTML += `<option value="${b.id}">${b.name}</option>`;
                    });
                }
            } catch (err) {
                showStatus("❌ Nem sikerült a táblák betöltése.", "error");
            }
        }

        // Csoportok betöltése a kiválasztott táblához
        async function loadGroups() {
            const boardId = document.getElementById('boardSelect').value;
            if (!boardId) return;
            
            const select = document.getElementById('groupSelect');
            select.innerHTML = '<option>Betöltés...</option>';
            
            try {
                const query = `{ boards (ids: ${boardId}) { groups { id title } } }`;
                const res = await callMonday(query);
                select.innerHTML = "";
                if (res.data && res.data.boards[0]) {
                    res.data.boards[0].groups.forEach(g => {
                        select.innerHTML += `<option value="${g.id}">${g.title}</option>`;
                    });
                }
            } catch (err) {
                showStatus("❌ Hiba a csoportoknál.", "error");
            }
        }

        // Küldés folyamata
        async function sendToMonday() {
            const btn = document.getElementById('mainBtn');
            const boardId = document.getElementById('boardSelect').value;
            const groupId = document.getElementById('groupSelect').value;

            if(!boardId || !groupId) {
                alert("Kérlek, válassz ki egy projektet és egy csoportot is!");
                return;
            }

            btn.disabled = true;
            showStatus("⏳ Adatok küldése...", "");

            try {
                // 1. Elem létrehozása
                const createQuery = `mutation { create_item (board_id: ${boardId}, group_id: "${groupId}", item_name: "${emailInfo.subject}") { id } }`;
                const itemRes = await callMonday(createQuery);
                
                if (itemRes.errors) throw new Error("API hiba");
                
                const itemId = itemRes.data.create_item.id;

                // 2. Szöveges tartalom és link összeállítása az Update-hez
                const shortBody = emailInfo.body.substring(0, 2500); // 2500 karakter korlát
                const fullUpdateText = `🔗 **Email link:** ${emailInfo.link}\n\n--- **LEVELEZÉS SZÖVEGE** ---\n\n${shortBody}`;
                
                const updateQuery = `mutation { create_update (item_id: ${itemId}, body: ${JSON.stringify(fullUpdateText)}) { id } }`;
                await callMonday(updateQuery);

                showStatus("✅ Siker! A feladat és a szöveg átkerült.", "success");
            } catch (e) {
                showStatus("❌ Hiba történt a küldés során.", "error");
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }

        // Segédfüggvény a monday.com API hívásokhoz
        async function callMonday(query) {
            const response = await fetch("https://api.monday.com/v2", {
                method: 'post',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': API_KEY 
                },
                body: JSON.stringify({ query })
            });
            return response.json();
        }

        // Státuszüzenetek megjelenítése
        function showStatus(text, className) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = text;
            statusDiv.className = className;
        }
    </script>
</body>
</html>
